{% extends "base.html" %}
{% block title %}Add customer{% endblock %}
{% block eyebrow %}Customers{% endblock %}
{% block heading %}Add customer{% endblock %}
{% block content %}
<div class="card" style="max-width:720px"><div class="card-body p-4">
  <form method="post" class="row g-3">
    <div class="col-md-6"><label class="form-label fw-semibold">Full name</label><input name="name" value="{{ form.get('name', '') }}" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Phone (10 digits)</label><input name="phone" value="{{ form.get('phone', '') }}" class="form-control" inputmode="numeric" maxlength="10"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">Email</label><input name="email" type="email" value="{{ form.get('email', '') }}" class="form-control"></div>
    <div class="col-md-6"><label class="form-label fw-semibold">City / area</label><input name="city" value="{{ form.get('city', '') }}" class="form-control"></div>
    <div class="col-12"><button class="btn btn-accent"><i class="bi bi-check2"></i> Save customer</button>
      <a href="{{ url_for('customers') }}" class="btn btn-link">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
